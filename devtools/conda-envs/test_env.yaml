name: evaluator-test-env
channels:
  - conda-forge
dependencies:
    # Base depends
  - python
  - uv

    # Testing and development
  - pytest
  - pytest-cov
  - pytest-xdist
  - pytest-randomly
  - pytest-timeout
  - nbval
  - requests-mock # For testing http requests.
  - foyer

    # Standard dependencies
  - openff-toolkit
  - openff-interchange >=0.5.1
  - ambertools =24
  - openmm
  - pymbar
  - dask >=2.7.0
  - distributed >=2.7.0
  - dask-jobqueue >=0.8.0
  - dask-kubernetes
  - uncertainties
  - openmmtools
  - pyyaml
  - requests
  - python-dateutil
  - pydantic
  - taproom
  - dataclasses
  - pandas =2

  # Shim
  - xmltodict !=1.0.3
